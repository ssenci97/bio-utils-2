[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synced_structure"
version = "0.1.0"
description = "Synchronized Biopython structures: chain mapping, contacts, contact maps, interfaces, and 3D views."
requires-python = ">=3.10"
authors = [{ name = "Sergio Senci", email = "sergio.senci@areasciencepark.it" }]
dependencies = [
    "biopython>=1.80",
    "numpy",
    "pandas",
    "mdtraj",
    "matplotlib",
    "pyyaml",
    "requests",
    "tqdm",
    "ipython",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
